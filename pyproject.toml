[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-backoffice"
version = "0.1.0"
description = "A forkable multi-agent back office for small teams: Claude Code agents with enforced guardrails, human approvals, budgets, audit trail and evals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Altan Kömek" }]
keywords = ["agents", "multi-agent", "claude", "claude-code", "agent-sdk", "mcp", "automation", "human-in-the-loop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
]
dependencies = [
  # Pinned on purpose: the Agent SDK moves fast. Re-run `make eval` before bumping.
  "claude-agent-sdk==0.2.163",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
backoffice = "backoffice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backoffice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/backoffice/demo.py" = ["E501"]  # demo fixture prose
